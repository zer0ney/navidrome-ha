[project]
name = "navidrome-ha-connectors"
version = "0.1.0"
description = "Read-only, native-push Navidrome now playing for Home Assistant"
requires-python = ">=3.14.2"
dependencies = ["aiohttp>=3.14.5", "httpx-sse==0.4.3", "httpx==0.28.1", "packaging>=23.1"]

[dependency-groups]
dev = [
  "homeassistant==2026.11.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-aiohttp==1.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.14.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]